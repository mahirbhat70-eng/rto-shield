# configs/cost_config.yaml
# WHY: Frozen industry-prior constants governing the COD intervention cost model.
#      EL(a) = friction(a) + p*(1-r)*150 - (1-p)*(1-d)*(0.20*V)
#      Changing these values changes every downstream number.
#      Phase 5 sensitivity scan quantifies how sensitive the 2.0x savings claim
#      is to these unvalidated priors.

rto_logistics_cost: 150
average_margin_pct: 0.20

interventions:
  ALLOW_COD:
    friction_cost: 0
    success_drop_pct: 0.00
    rto_reduction_pct: 0.00
  VERIFY_ADDRESS:
    friction_cost: 2
    success_drop_pct: 0.05
    rto_reduction_pct: 0.30
  REQUIRE_DEPOSIT:
    friction_cost: 0
    success_drop_pct: 0.40
    rto_reduction_pct: 0.80
  PREPAID_ONLY:
    friction_cost: 0
    success_drop_pct: 0.70
    rto_reduction_pct: 0.55
