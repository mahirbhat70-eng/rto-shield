services:
  - type: web
    name: flipprice-api
    env: docker
    plan: starter
    region: singapore # Lowest latency (~35ms) to Indian merchant checkouts
    healthCheckPath: /health
    disk:
      name: flipprice-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: RTO_SHIELD_ENV
        value: production
      - key: RTO_SHIELD_PINNED_DIGESTS
        value: '{"models/tree_model.pkl":"e75478885e620297d17f08cc9e7211aa1d1385f33cfb73560bbf916a77fa7477","models/tree_model_calibrated.pkl":"2e6b0c5198dd56b2053263ea3d25835bcd1ee95b57c2c982de5650a297538b2c","models/tree_model_booster.pkl":"db099b05d7af60a74c5f4a788b435cc2ef1c89a1026a2de81258875df796f23a","models/logistic_baseline.pkl":"8530ca0636751d03b9c4cba5532d4a39908e084e75050630a5959ad0b23fd29d"}'
      - key: FLIPPRICE_PII_SALT
        generateValue: true
      - key: SHOPIFY_API_SECRET
        sync: false
